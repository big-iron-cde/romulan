[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "romulan"
version = "0.1.0"
description = "Build and upload ROM images for the Pico-as-ROM 65C02 system."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Douglas Luman", email = "dluman@allegheny.edu"},
    {name = "Abishek Dhakal", email = "dhakal01@allegheny.edu"},
    {name = "Molly Suppo", email = "suppo01@allegheny.edu"},
    {name = "Cullen Doyle", email = "doyle01@allegheny.edu"}
]
dependencies = [
    "pyserial>=3.5",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

keywords = ["65c02", "rom", "pico", "raspberry-pi", "embedded", "serial", "retrocomputing", "6502", "firmware", "upload"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
"Homepage" = "https://github.com/big-iron-cde/romulan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "range: Tests to verify out of range values raise error.",
    "memory: Invalid opcodes as memory instruction for address-dependent functionality.",
    "validity: Invalid opcodes without need for additional parameters."
]

[project.scripts]
romulan = "romulan.main:main"
