name: Error Handling Deployment Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          echo "Installing necessary dependencies..."
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Run Error Handling Test Suite
        run: |
          echo "Running test files..."
          uv run pytest tests/test_main.py
          uv run pytest tests/test_error_processing.py
