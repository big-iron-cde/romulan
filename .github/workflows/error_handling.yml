name: Error Handling Deployment Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          echo "Installing necessary dependencies..."
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Run Error Handling Test Suite
        run: |
          echo "Running test files..."
          pytest tests/test_main.py
          pytest tests/test_error_processing.py
