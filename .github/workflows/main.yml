name: Hardware Test

on:
  push:
    branches:
      - main
      - workflow-hardware-testing

jobs:
  hardware-test:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup uv
      run: |
        echo "Installing uv..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        source $HOME/.local/bin/env
        uv sync

    - name: Build test ROM
      run: |
        mkdir -p bin
        uv run romulan demo.txt --build -o bin/rom.bin

 #   - name: hardware reset --assert
 #     continue-on-error: true
 #     run: uv run romulan hardware reset --assert --verbose

    - name: hardware upload
      continue-on-error: true
      run: uv run romulan hardware upload bin/rom.bin --verbose

    - name: hardware reset --release
      continue-on-error: true
      run: uv run romulan hardware reset --release --verbose

    - name: hardware capture (default timeout)
      continue-on-error: true
      run: uv run romulan hardware capture --max-cycles 500 --verbose

    - name: hardware capture (custom timeout)
      continue-on-error: true
      run: uv run romulan hardware capture --max-cycles 500 --timeout 45 --verbose

    - name: hardware monitor --disable
      continue-on-error: true
      run: uv run romulan hardware monitor --disable --verbose

    - name: hardware monitor --enable
      run: uv run romulan hardware monitor --enable --verbose
